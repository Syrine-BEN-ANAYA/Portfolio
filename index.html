<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syrine BEN ANAYA - Software Engineer</title>
    <meta name="description" content="Syrine BEN ANAYA — Software Engineer, full-stack developer (React, NestJS, PHP) based in Muscat, Oman." />
    <meta name="theme-color" content="#0d1130" />

    <script>
        /* Apply theme before first paint to avoid a flash */
        (function () {
            var root = document.documentElement;
            root.classList.add('js');
            try {
                var t = localStorage.getItem('theme2') ||
                    (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                root.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Cairo:wght@300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" />

    <style>
        /* ====================================================
           TOKENS
           ==================================================== */
        :root {
            --ease: cubic-bezier(.22, 1, .36, 1);
            --font-d: 'Bricolage Grotesque', 'Cairo', sans-serif;
            --font-b: 'Instrument Sans', 'Cairo', sans-serif;
            --font-m: 'JetBrains Mono', monospace;
            --r-lg: 28px;
            --r-md: 18px;
            --wrap: 1080px;
            --nav-h: 64px;
        }
        html[lang="ar"] {
            --font-d: 'Cairo', sans-serif;
            --font-b: 'Cairo', sans-serif;
        }

        /* Midnight lagoon: deep indigo, saffron, rose, sea-glass */
        [data-theme="dark"] {
            --bg: #0d1130;
            --bg2: #131955;
            --card: #151b4d;
            --text: #f4efe4;
            --muted: #aeb0d4;
            --line: rgba(244, 239, 228, .14);
            --glass: rgba(19, 25, 85, .62);
            --a1: #ffb547;
            --a2: #ff6b9a;
            --a3: #62f0d4;
            --on-a1: #14123a;
            --aurora-o: .42;
            --grain-o: .07;
        }
        [data-theme="light"] {
            --bg: #f6f0e4;
            --bg2: #ece3cf;
            --card: #fffaf1;
            --text: #141a45;
            --muted: #4b5082;
            --line: rgba(20, 26, 69, .16);
            --glass: rgba(255, 250, 241, .72);
            --a1: #c8430f;
            --a2: #c2185b;
            --a3: #0b8f7a;
            --on-a1: #ffffff;
            --aurora-o: .5;
            --grain-o: .09;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 90px; -webkit-text-size-adjust: 100%; font-size: 90%; }
        body {
            font-family: var(--font-b);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color .4s ease, color .4s ease;
        }
        body.loading { overflow: hidden; }
        a { color: inherit; text-decoration: none; }
        ul { list-style: none; }
        img { display: block; max-width: 100%; }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
        h1, h2, h3, h4 { font-family: var(--font-d); line-height: 1.05; letter-spacing: -.02em; }
        html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] h4 { letter-spacing: 0; line-height: 1.25; }

        :focus-visible { outline: 2px solid var(--a3); outline-offset: 3px; border-radius: 6px; }
        ::selection { background: var(--a1); color: var(--on-a1); }

        .wrap { width: min(var(--wrap), calc(100% - 40px)); margin-inline: auto; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* ====================================================
           ATMOSPHERE (aurora + grain + progress + cursor)
           ==================================================== */
        .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .aurora i {
            position: absolute; border-radius: 50%; filter: blur(90px);
            opacity: var(--aurora-o); will-change: transform;
        }
        .aurora i:nth-child(1) { width: 46vmax; height: 46vmax; background: var(--a2); top: -18vmax; inset-inline-start: -14vmax; animation: drift1 26s ease-in-out infinite alternate; }
        .aurora i:nth-child(2) { width: 40vmax; height: 40vmax; background: var(--a3); bottom: -16vmax; inset-inline-end: -12vmax; animation: drift2 32s ease-in-out infinite alternate; }
        .aurora i:nth-child(3) { width: 30vmax; height: 30vmax; background: var(--a1); top: 38%; inset-inline-start: 42%; opacity: calc(var(--aurora-o) * .55); animation: drift1 38s ease-in-out infinite alternate-reverse; }
        @keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.18); } }
        @keyframes drift2 { to { transform: translate(-12vmax, -8vmax) scale(1.12); } }

        body::after {
            content: ''; position: fixed; inset: 0; z-index: 90; pointer-events: none;
            opacity: var(--grain-o); mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        }

        .progress {
            position: fixed; top: 0; inset-inline: 0; height: 3px; z-index: 70;
            background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3));
            transform: scaleX(0); transform-origin: left; pointer-events: none;
        }
        html[dir="rtl"] .progress { transform-origin: right; }

        .halo {
            position: fixed; top: 0; left: 0; z-index: 95; pointer-events: none;
            width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%;
            border: 1.5px solid #fff; mix-blend-mode: difference; opacity: 0;
            transition: width .35s var(--ease), height .35s var(--ease), margin .35s var(--ease), opacity .3s, background .3s;
        }
        .halo.on { opacity: 1; }
        .halo.big { width: 76px; height: 76px; margin: -38px 0 0 -38px; background: #fff; }

        /* ====================================================
           PRELOADER
           ==================================================== */
        .pre {
            position: fixed; inset: 0; z-index: 100; background: var(--bg2);
            display: grid; place-items: center;
            clip-path: inset(0 0 0 0);
            transition: clip-path 1.05s var(--ease);
        }
        .pre.out { clip-path: inset(0 0 100% 0); }
        .pre-name {
            font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(3.4rem, 15vw, 9rem);
            letter-spacing: -.04em; color: var(--text);
            animation: wght 1.1s var(--ease) forwards;
            font-variation-settings: "wght" 200, "wdth" 75;
        }
        @keyframes wght { to { font-variation-settings: "wght" 800, "wdth" 100; } }

        /* ====================================================
           NAV
           ==================================================== */
        .nav {
            position: fixed; top: 14px; left: 0; right: 0; margin-inline: auto; z-index: 60;
            width: min(1100px, calc(100% - 24px)); height: var(--nav-h);
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            padding-inline: 1.1rem 0.7rem;
            border: 1px solid var(--line); border-radius: 999px;
            transition: top .5s var(--ease);
        }
        /* glass lives on a pseudo-element so the nav itself creates no containing block for the mobile overlay */
        .nav::before {
            content: ''; position: absolute; inset: -1px; border-radius: inherit; z-index: -1;
            background: var(--glass);
            backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
        }
        .nav.hide { top: -100px; }
        .logo { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1.35rem; letter-spacing: -.03em; display: inline-flex; align-items: center; gap: .1rem; }
        .logo i { width: 9px; height: 9px; background: var(--a1); border-radius: 50%; display: inline-block; margin-inline-start: 3px; transition: border-radius .5s var(--ease), transform .5s var(--ease); }
        .logo:hover i { border-radius: 2px; transform: rotate(135deg) scale(1.2); }

        .nav-links { display: flex; gap: .2rem; }
        .nav-links a {
            padding: .5rem .95rem; border-radius: 999px; font-size: .93rem; font-weight: 500; color: var(--muted);
            transition: background .3s, color .3s;
        }
        .nav-links a:hover { color: var(--text); }
        .nav-links a.active { background: var(--text); color: var(--bg); }

        .ctrl { display: flex; align-items: center; gap: .4rem; }
        .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
        .seg button {
            min-width: 36px; height: 32px; padding-inline: .55rem; border-radius: 999px; font-size: .8rem; font-weight: 600; color: var(--muted);
            transition: background .3s, color .3s;
        }
        .seg button[aria-pressed="true"] { background: var(--a1); color: var(--on-a1); }
        .icon-ctl {
            width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
            display: grid; place-items: center; font-size: 1rem; transition: background .3s, transform .5s var(--ease);
        }
        .icon-ctl:hover { background: var(--line); transform: rotate(18deg); }
        .burger { display: none; }

        @media (max-width: 900px) {
            .burger { display: grid; }
            .nav-links {
                position: fixed; inset: 0; z-index: -1; flex-direction: column; justify-content: center; align-items: center; gap: .6rem;
                background: var(--bg2);
                clip-path: circle(0 at calc(100% - 40px) 40px);
                transition: clip-path .8s var(--ease), visibility 0s .8s;
                visibility: hidden;
                pointer-events: none;
            }
            .menu-open .nav-links { visibility: visible; transition-delay: 0s; }
            html[dir="rtl"] .nav-links { clip-path: circle(0 at 40px 40px); }
            .menu-open .nav-links { clip-path: circle(150% at calc(100% - 40px) 40px); pointer-events: auto; }
            html[dir="rtl"] .menu-open .nav-links { clip-path: circle(150% at 40px 40px); }
            .nav-links a { font-family: var(--font-d); font-size: 2.4rem; font-weight: 700; color: var(--text); padding: .3rem 1.2rem; }
            .nav { z-index: 80; }
        }
        @media (max-width: 420px) {
            .seg button { min-width: 30px; padding-inline: .4rem; }
            .logo { font-size: 1.15rem; }
        }

        /* ====================================================
           BUTTONS & SHARED
           ==================================================== */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: .6rem;
            padding: .95rem 1.6rem; border-radius: 999px; font-weight: 600; font-size: .95rem;
            transition: transform .4s var(--ease), background .3s, color .3s, border-color .3s;
            will-change: transform; position: relative;
        }
        .btn-solid { background: var(--a1); color: var(--on-a1); }
        .btn-solid:hover { background: var(--text); color: var(--bg); }
        .btn-line { border: 1.5px solid var(--line); color: var(--text); }
        .btn-line:hover { border-color: var(--text); background: var(--text); color: var(--bg); }

        section { position: relative; z-index: 1; }
        .sec { padding-block: clamp(3rem, 6vw, 5rem); }

        .sec-title {
            font-size: clamp(2rem, 5vw, 3.8rem); font-weight: 800; font-variation-settings: "wdth" 85;
            margin-bottom: clamp(1.4rem, 3vw, 2.2rem);
        }
        .line { display: block; overflow: hidden; padding-bottom: .12em; }
        .line > span { display: block; transform: translateY(112%); transition: transform 1.1s var(--ease); }
        .in .line > span, .line.in > span { transform: none; }

        /* clip wipe reveal for cards */
        .wipe { clip-path: inset(0 0 100% 0 round var(--r-lg)); transition: clip-path 1.1s var(--ease); transition-delay: calc(var(--d, 0) * 110ms); }
        .wipe.in { clip-path: inset(0 0 -2% 0 round var(--r-lg)); }
        html:not(.js) .wipe, html:not(.js) .line > span { clip-path: none; transform: none; }

        /* spotlight follows pointer */
        .spot { position: relative; isolation: isolate; }
        .spot::before {
            content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
            background: radial-gradient(460px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--a1) 26%, transparent), transparent 62%);
            opacity: 0; transition: opacity .4s;
        }
        .spot:hover::before { opacity: 1; }

        /* ====================================================
           HERO
           ==================================================== */
        .hero { min-height: 100svh; padding-top: calc(var(--nav-h) + 40px); padding-bottom: 2.5rem; display: flex; align-items: center; }
        .hero .wrap { width: min(var(--wrap), calc(100% - 40px)); }

        .status { display: inline-flex; align-items: center; flex-wrap: wrap; gap: .6rem; font-size: .9rem; color: var(--muted); padding: .45rem 1rem; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); }
        .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--a3); box-shadow: 0 0 0 0 var(--a3); animation: ping 2.4s infinite; flex-shrink: 0; }
        .status .sep { width: 1px; height: 14px; background: var(--line); }
        @keyframes ping { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

        .greet { margin-top: 1.6rem; font-size: clamp(1.05rem, 2.2vw, 1.4rem); color: var(--muted); }

        .name {
            font-size: clamp(3.4rem, 14vw, 9.5rem); font-weight: 800; letter-spacing: -.045em; line-height: .88;
            display: flex; flex-wrap: wrap; overflow: hidden; padding: .02em .04em .14em 0; margin-top: .1rem;
            font-variation-settings: "wght" 700, "wdth" 100;
        }
        .name .ch {
            display: inline-block; transform: translateY(108%);
            font-variation-settings: "wght" var(--w, 420), "wdth" var(--wd, 82);
            transition: transform 1.2s var(--ease);
            transition-delay: calc(var(--i) * 70ms);
            will-change: font-variation-settings;
        }
        .ready .name .ch { transform: none; }
        .name .ar-word { display: inline-block; transform: translateY(108%); transition: transform 1.2s var(--ease); font-weight: 800; }
        .ready .name .ar-word { transform: none; animation: arwght 5s ease-in-out 1.2s infinite alternate; }
        @keyframes arwght { from { font-weight: 400; } to { font-weight: 900; } }

        .hero-grid { display: grid; gap: 2.6rem; margin-top: 1.4rem; align-items: center; }
        @media (min-width: 960px) { .hero-grid { grid-template-columns: 1.05fr .95fr; gap: 4rem; } }

        .role { font-family: var(--font-d); font-size: clamp(1.15rem, 2.4vw, 1.6rem); font-weight: 600; min-height: 1.4em; display: flex; align-items: center; color: var(--a1); }
        .caret { display: inline-block; width: 3px; height: 1.1em; background: var(--a3); margin-inline-start: 4px; animation: blink .9s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .pitch { margin-top: 1.1rem; font-size: clamp(1rem, 1.6vw, 1.18rem); color: var(--muted); max-width: 52ch; }
        .cta { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 1.8rem; }
        .socials { display: flex; gap: .6rem; margin-top: 1.6rem; }
        .soc {
            width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 1.05rem;
            transition: background .3s, color .3s, transform .5s var(--ease), border-radius .5s var(--ease);
        }
        .soc:hover { background: var(--a1); color: var(--on-a1); border-color: transparent; border-radius: 14px; transform: translateY(-5px); }

        /* morphing visual */
        .visual { position: relative; width: 100%; max-width: 460px; margin-inline: auto; aspect-ratio: 1 / .92; }
        .blob {
            position: absolute; inset: 2% 4% 8% 6%;
            background: conic-gradient(from 20deg, var(--a1), var(--a2), var(--a3), var(--a1));
            border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
            animation: morph 13s ease-in-out infinite, turn 40s linear infinite;
            opacity: .92;
        }
        @keyframes morph {
            0%, 100% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; }
            25% { border-radius: 63% 37% 38% 62% / 58% 63% 37% 42%; }
            50% { border-radius: 35% 65% 55% 45% / 38% 35% 65% 62%; }
            75% { border-radius: 55% 45% 40% 60% / 62% 40% 60% 38%; }
        }
        @keyframes turn { to { transform: rotate(360deg); } }
        .visual .ring-deco {
            position: absolute; inset: -2%; border: 1.5px dashed var(--line); border-radius: 50%; animation: turn 60s linear infinite reverse; opacity: .8;
        }

        .code-window {
            position: absolute; inset-inline: 7% -2%; top: 20%;
            background: #0b0e2a; border: 1px solid rgba(255, 255, 255, .14); border-radius: 18px; overflow: hidden;
            box-shadow: 0 40px 80px rgba(5, 6, 30, .55); font-family: var(--font-m); direction: ltr; text-align: left;
            transform: translate(calc(var(--px, 0) * -14px), calc(var(--py, 0) * -10px)) rotate(-2deg);
            transition: transform .3s ease-out;
        }
        .code-bar { display: flex; align-items: center; gap: 6px; padding: .65rem .9rem; border-bottom: 1px solid rgba(255, 255, 255, .1); }
        .code-bar i { width: 10px; height: 10px; border-radius: 50%; }
        .code-bar i:nth-child(1) { background: #ff5f57; } .code-bar i:nth-child(2) { background: #febc2e; } .code-bar i:nth-child(3) { background: #28c840; }
        .code-bar span { margin-inline-start: .5rem; font-size: .72rem; color: #8f96c8; }
        .code-body { padding: 1rem 1.1rem 1.2rem; font-size: clamp(.68rem, 1.8vw, .82rem); line-height: 1.75; color: #ece8f7; min-height: 250px; overflow-x: auto; }
        .code-line { white-space: pre; opacity: 0; animation: lineIn .45s ease forwards; }
        @keyframes lineIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
        .t-kw { color: #ff9bd0; } .t-str { color: #9bf0d8; } .t-fn { color: #ffd27a; } .t-var { color: #c9b8ff; } .t-com { color: #6f77b0; } .t-p { color: #8f96c8; }
        .code-cursor { display: inline-block; width: 7px; height: 1em; background: var(--a3); vertical-align: middle; animation: blink .9s step-end infinite; }

        .chip {
            position: absolute; z-index: 3; display: inline-flex; align-items: center; gap: .45rem; padding: .45rem .9rem;
            background: var(--card); border: 1px solid var(--line); border-radius: 999px; font-size: .8rem; font-weight: 600;
            animation: bob 6s ease-in-out infinite; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
        }
        .chip.c1 { top: 4%; inset-inline-start: 0; color: #61DAFB; }
        .chip.c2 { bottom: 16%; inset-inline-end: -2%; color: #ff4f7b; animation-delay: -2s; }
        .chip.c3 { bottom: 1%; inset-inline-start: 14%; color: #7bd36a; animation-delay: -4s; }
        .chip span { color: var(--text); }
        @keyframes bob { 50% { transform: translateY(-12px); } }

        .stats { display: flex; flex-wrap: wrap; gap: 2.4rem; margin-top: 3.2rem; padding-top: 1.6rem; border-top: 1px solid var(--line); }
        .stat b { display: block; font-family: var(--font-d); font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; line-height: 1; }
        .stat span { font-size: .85rem; color: var(--muted); }

        /* ====================================================
           MARQUEE
           ==================================================== */
        .marquee { position: relative; z-index: 1; overflow: hidden; border-block: 1px solid var(--line); padding-block: 1.1rem; background: color-mix(in srgb, var(--bg2) 60%, transparent); direction: ltr; }
        .track { display: flex; width: max-content; animation: scroll 34s linear infinite; }
        .marquee:hover .track { animation-play-state: paused; }
        .track span { font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(1.4rem, 3.6vw, 2.6rem); font-weight: 800; letter-spacing: -.03em; padding-inline: 1.2rem; display: inline-flex; align-items: center; gap: 3.2rem; white-space: nowrap; }
        .track span:nth-child(even) { color: transparent; -webkit-text-stroke: 1.5px var(--text); }
        .track span::after { content: ''; width: 16px; height: 16px; background: var(--a1); border-radius: 50%; animation: shape 6s ease-in-out infinite; }
        @keyframes shape { 50% { border-radius: 3px; transform: rotate(135deg); background: var(--a2); } }
        @keyframes scroll { to { transform: translateX(-50%); } }

        /* ====================================================
           ABOUT
           ==================================================== */
        .about-grid { display: grid; gap: 1.2rem; }

        .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: clamp(1.4rem, 3vw, 2.2rem); }
        .panel h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.4rem; display: flex; align-items: center; gap: .7rem; }
        .panel h3 i { color: var(--a1); }

        .bio { display: flex; align-items: center; background: linear-gradient(135deg, var(--card), color-mix(in srgb, var(--card) 70%, var(--a2))); }
        .bio p { font-family: var(--font-d); font-size: clamp(1.1rem, 1.9vw, 1.5rem); font-weight: 500; line-height: 1.3; letter-spacing: -.015em; }
        html[lang="ar"] .bio p { line-height: 1.7; }

        /* ====================================================
           SKILLS (weight of the typeface = level)
           ==================================================== */
        .skills-grid { display: grid; gap: 1.2rem; }
        @media (min-width: 700px) { .skills-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1100px) { .skills-grid { grid-template-columns: repeat(4, 1fr); } }
        .skill-card h3 { font-size: 1.15rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: .7rem; }
        .skill-card h3 i { color: var(--a1); }
        .sk { margin-bottom: 1.25rem; }
        .sk:last-child { margin-bottom: 0; }
        .sk-top { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; margin-bottom: .45rem; }
